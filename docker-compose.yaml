services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"              # API do Ollama
    networks:
      - gnomo_net
    volumes:
      - ./ollama_data:/root/.ollama  # onde ficam os modelos

  backend:
    build: ./backend
    container_name: gnomo-backend
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "4000:4000"
    volumes:
      - ./documents:/app/documents
      - ./embeddings:/app/embeddings
      - ./backend/users.json:/app/users.json
      - ./backend/chats.json:/app/chats.json
      - ./backend/logs.json:/app/logs.json
    environment:
      - OLLAMA_URL=http://ollama:11434     # fala com o serviço 'ollama'
      - NODE_OPTIONS=--max-old-space-size=8192
    networks:
      - gnomo_net
    # Observação: 'deploy.resources' só tem efeito em Swarm; em Compose local é ignorado.
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  frontend:
    build: ./frontend
    container_name: gnomo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - gnomo_net

networks:
  gnomo_net:
    driver: bridge

volumes:
  documents:
  embeddings:
