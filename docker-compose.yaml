version: "3.9"

x-ollama-common: &ollama-common
  container_name: ollama
  restart: unless-stopped
  ports:
    - "11434:11434"                # API do Ollama
  volumes:
    - ./ollama_data:/root/.ollama  # onde ficam os modelos

services:
  # ----------------- CPU (fallback) -----------------
  ollama-cpu:
    <<: *ollama-common
    image: ollama/ollama:latest
    profiles: ["cpu"]
    networks:
      gnomo_net:
        aliases: ["ollama"]        # backend usa http://ollama:11434

  # ----------------- NVIDIA -----------------
  ollama-nvidia:
    <<: *ollama-common
    image: ollama/ollama:latest
    profiles: ["gpu-nvidia"]
    # Forma moderna (Compose v2): device requests
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
              driver: nvidia
              count: 1
    # Compatibilidade (alguns hosts): NVIDIA_VISIBLE_DEVICES
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
    networks:
      gnomo_net:
        aliases: ["ollama"]

  # ----------------- AMD (ROCm) -----------------
  ollama-amd:
    <<: *ollama-common
    image: ollama/ollama:rocm
    profiles: ["gpu-amd"]
    devices:
      - /dev/kfd
      - /dev/dri
    group_add: ["video","render"]
    # Se precisar, adicione variáveis aqui (exemplo):
    # environment:
    #   HSA_OVERRIDE_GFX_VERSION: "10.3.0"
    networks:
      gnomo_net:
        aliases: ["ollama"]

  # (Opcional) INTEL – suporte varia; use apenas se tiver a imagem preparada
  # ollama-intel:
  #   <<: *ollama-common
  #   image: intel/ipex-llm-ollama:latest
  #   profiles: ["gpu-intel"]
  #   devices:
  #     - /dev/dri
  #   group_add: ["video","render"]
  #   networks:
  #     gnomo_net:
  #       aliases: ["ollama"]

  backend:
    build: ./backend
    container_name: gnomo-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./documents:/app/documents
      - ./embeddings:/app/embeddings
      - ./backend/users.json:/app/users.json
      - ./backend/chats.json:/app/chats.json
      - ./backend/logs.json:/app/logs.json
    environment:
      - OLLAMA_URL=http://ollama:11434
      - NODE_OPTIONS=--max-old-space-size=8192
    networks:
      - gnomo_net
    # Observação: 'deploy.resources' tem efeito pleno no Swarm; no Compose local é parcialmente ignorado.
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  frontend:
    build: ./frontend
    container_name: gnomo-frontend
    restart: unless-stopped
    # Não usamos depends_on, pois o serviço de IA varia por profile.
    ports:
      - "3000:80"
    networks:
      - gnomo_net

networks:
  gnomo_net:
    driver: bridge

volumes:
  documents:
  embeddings:
